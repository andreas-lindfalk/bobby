services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bobby-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bobby
    ports:
      - "5432:5432"
    volumes:
      - bobby-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: bobby-ollama
    ports:
      - "11434:11434"
    volumes:
      - bobby-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bobby-pgdata:
  bobby-ollama:
